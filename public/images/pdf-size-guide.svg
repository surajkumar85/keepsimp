<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Compress a PDF to a size</title><desc id="desc">A PDF of 3.2 MB beside a limit marked at 200 KB, and the same PDF fitted just under the limit.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <g fill="#fff" stroke="#d4d4d4"><rect x="60" y="70" width="780" height="200" rx="16"/><rect x="60" y="330" width="780" height="200" rx="16"/></g>
  <g font-family="sans-serif" font-size="17" fill="#525252"><text x="87" y="110">CERTIFICATE.PDF</text><text x="87" y="370">CERTIFICATE-COMPRESSED.PDF</text></g>
  <g font-family="monospace" font-size="22" fill="#0a0a0a" text-anchor="end"><text x="813" y="112">3.2 MB</text><text x="813" y="372">187 KB</text></g>
  <rect x="87" y="140" width="726" height="34" rx="17" fill="#00564f"/>
  <rect x="87" y="400" width="726" height="34" rx="17" fill="#e5e5e5"/>
  <rect x="87" y="400" width="118" height="34" rx="17" fill="#00786f"/>
  <g stroke="#b42318" stroke-width="3" stroke-dasharray="7 6"><line x1="213" y1="126" x2="213" y2="188"/><line x1="213" y1="386" x2="213" y2="448"/></g>
  <g font-family="sans-serif" font-size="15" fill="#b42318"><text x="223" y="210">Limit: 200 KB</text><text x="223" y="470">Limit: 200 KB</text></g>
  <g font-family="sans-serif" font-size="16" fill="#525252"><text x="87" y="240">Sixteen times over the limit.</text><text x="87" y="500">Fits, with the best quality the size allows. Text still sharp.</text></g>
  <g stroke="#00786f" stroke-width="2" fill="none" stroke-linecap="round"><path d="M450 280 v36 m-8 -10 l8 10 l8 -10"/></g>
  <g fill="#00786f"><circle cx="780" cy="480" r="26"/></g>
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M768 481 l9 9 l16 -18"/></g>
</svg>
