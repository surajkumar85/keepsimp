<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Transcribe audio on your device</title><desc id="desc">A transcript in parts with their times beside a player, one part highlighted as it plays, and buttons to save it as text, SRT and WebVTT.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <rect x="70" y="70" width="760" height="460" rx="16" fill="#fff" stroke="#d4d4d4"/>
  <text x="96" y="114" font-family="sans-serif" font-size="22" font-weight="600" fill="#0a0a0a">Transcript</text>
  <rect x="96" y="138" width="708" height="40" rx="20" fill="#f1f1f1"/>
  <circle cx="122" cy="158" r="9" fill="#00786f"/>
  <rect x="146" y="155" width="560" height="6" rx="3" fill="#d4d4d4"/><rect x="146" y="155" width="190" height="6" rx="3" fill="#00786f"/>
  <text x="790" y="163" font-family="monospace" font-size="13" fill="#525252" text-anchor="end">0:04 / 0:12</text>
  <text x="110" y="230" font-family="monospace" font-size="15" fill="#525252">0:00</text><text x="170" y="230" font-family="sans-serif" font-size="16" fill="#0a0a0a">The quick brown fox jumps over the lazy dog.</text><rect x="96" y="254" width="708" height="36" rx="8" fill="#e6f2f1"/><text x="110" y="278" font-family="monospace" font-size="15" fill="#525252">0:03</text><text x="170" y="278" font-family="sans-serif" font-size="16" fill="#0a0a0a">Recording a voice note in a busy room is hard,</text><text x="110" y="326" font-family="monospace" font-size="15" fill="#525252">0:06</text><text x="170" y="326" font-family="sans-serif" font-size="16" fill="#0a0a0a">so we remove the background noise on your device.</text><text x="110" y="374" font-family="monospace" font-size="15" fill="#525252">0:10</text><text x="170" y="374" font-family="sans-serif" font-size="16" fill="#0a0a0a">Then every word is written down.</text>
  <rect x="96" y="462" width="64" height="40" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="128.0" y="488" font-family="sans-serif" font-size="15" fill="#0a0a0a" text-anchor="middle">Text</text><rect x="172" y="462" width="54" height="40" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="199.0" y="488" font-family="sans-serif" font-size="15" fill="#0a0a0a" text-anchor="middle">SRT</text><rect x="238" y="462" width="84" height="40" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="280.0" y="488" font-family="sans-serif" font-size="15" fill="#0a0a0a" text-anchor="middle">WebVTT</text>
</svg>
