<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Trimming a video</title><desc id="desc">A video's timeline with keyframes marked under it. Two parts are kept and the middle is cut out; the result joins the two parts into one shorter MP4, copied without encoding.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <g font-family="sans-serif">
    <rect x="56" y="70" width="788" height="250" rx="20" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <text x="84" y="116" font-size="22" font-weight="600" fill="#171717">interview.mp4</text>
    <text x="816" y="116" text-anchor="end" font-size="17" fill="#525252">12:40</text>
    <rect x="84" y="146" width="732" height="76" rx="10" fill="#e5e5e5"/>
    <rect x="84" y="146" width="250" height="76" rx="10" fill="#00786f" opacity="0.3"/>
    <rect x="530" y="146" width="286" height="76" rx="10" fill="#00786f" opacity="0.3"/>
    <rect x="96" y="152" width="226" height="64" rx="6" fill="none" stroke="#00786f" stroke-width="4"/>
    <path d="M346 158 L518 210 M346 210 L518 158" stroke="#a3a3a3" stroke-width="3" stroke-linecap="round"/>
    <g fill="#525252">
      <rect x="84" y="232" width="2" height="14"/><rect x="176" y="232" width="2" height="14"/><rect x="268" y="232" width="2" height="14"/><rect x="360" y="232" width="2" height="14"/><rect x="452" y="232" width="2" height="14"/><rect x="544" y="232" width="2" height="14"/><rect x="636" y="232" width="2" height="14"/><rect x="728" y="232" width="2" height="14"/>
    </g>
    <text x="84" y="282" font-size="16" fill="#525252">Keyframes: where a copy can begin and end</text>
    <path d="M450 340 V384" stroke="#00786f" stroke-width="6" stroke-linecap="round"/>
    <path d="M432 368 L450 388 L468 368" fill="none" stroke="#00786f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="236" y="404" width="428" height="68" rx="16" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <rect x="256" y="420" width="140" height="36" rx="6" fill="#00786f" opacity="0.3"/>
    <rect x="400" y="420" width="160" height="36" rx="6" fill="#00786f" opacity="0.3"/>
    <text x="578" y="444" font-size="17" font-weight="600" fill="#171717">6:10</text>
    <rect x="56" y="500" width="788" height="64" rx="16" fill="#e6f2f1"/>
    <circle cx="92" cy="532" r="13" fill="#00786f"/><path d="M86 532 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="114" y="538" font-size="17" fill="#00564f">Copied, nothing lost</text>
    <circle cx="352" cy="532" r="13" fill="#00786f"/><path d="M346 532 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="374" y="538" font-size="17" fill="#00564f">Or exact to the frame</text>
    <circle cx="612" cy="532" r="13" fill="#00786f"/><path d="M606 532 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="634" y="538" font-size="17" fill="#00564f">Checked</text>
  </g>
</svg>
