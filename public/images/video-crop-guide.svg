<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Cropping a video to a shape</title><desc id="desc">A wide 16:9 video frame with a tall 9:16 box and a square box marked around its middle, and three phone-shaped results.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <g font-family="sans-serif">
    <rect x="80" y="90" width="480" height="270" rx="12" fill="#00564f"/>
    <path d="M80 300 L200 200 L300 270 L400 180 L560 290 V360 H80 Z" fill="#00786f"/>
    <rect x="244" y="90" width="152" height="270" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="14 8"/>
    <rect x="185" y="90" width="270" height="270" fill="none" stroke="#e6f2f1" stroke-width="3"/>
    <text x="80" y="400" font-size="20" font-weight="600" fill="#171717">16:9 · 1920 × 1080</text>
    <path d="M590 225 H640" stroke="#00786f" stroke-width="6" stroke-linecap="round"/>
    <path d="M624 207 L644 225 L624 243" fill="none" stroke="#00786f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="670" y="80" width="150" height="266" rx="18" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <rect x="682" y="96" width="126" height="224" rx="8" fill="#00564f"/>
    <path d="M682 270 L730 220 L780 262 L808 240 V320 H682 Z" fill="#00786f"/>
    <text x="745" y="380" text-anchor="middle" font-size="20" font-weight="600" fill="#171717">9:16</text>
    <rect x="56" y="470" width="788" height="76" rx="16" fill="#e6f2f1"/>
    <text x="92" y="516" font-size="18" fill="#00564f">9:16 Reels, Shorts, TikTok   ·   1:1 feeds   ·   4:5 portrait posts</text>
  </g>
</svg>
