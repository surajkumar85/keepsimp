<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">KeepSimp's tools for AI agents</title><desc id="desc">A terminal where an agent is asked to format a file, an arrow to a KeepSimp page running in a hidden browser on the same computer, and the formatted file saved beside the first.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <rect x="40" y="90" width="360" height="300" rx="14" fill="#171717"/>
  <circle cx="66" cy="114" r="6" fill="#525252"/><circle cx="86" cy="114" r="6" fill="#525252"/><circle cx="106" cy="114" r="6" fill="#525252"/>
  <text x="64" y="170" font-family="monospace" font-size="17" fill="#a3a3a3">&gt; format data.json</text>
  <text x="64" y="198" font-family="monospace" font-size="17" fill="#a3a3a3">  with sorted keys</text>
  <text x="64" y="246" font-family="monospace" font-size="17" fill="#fafafa">keepsimp · format_json</text>
  <rect x="64" y="262" width="300" height="8" rx="4" fill="#404040"/>
  <rect x="64" y="262" width="300" height="8" rx="4" fill="#00786f"/>
  <text x="64" y="310" font-family="monospace" font-size="17" fill="#fafafa">Saved data-formatted.json</text>
  <text x="64" y="338" font-family="monospace" font-size="17" fill="#a3a3a3">Numbers kept exact.</text>
  <path d="M415 240 H485" stroke="#00786f" stroke-width="6" stroke-linecap="round"/>
  <path d="M470 222 L490 240 L470 258" fill="none" stroke="#00786f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="500" y="90" width="360" height="300" rx="14" fill="#ffffff" stroke="#d4d4d4" stroke-width="2" stroke-dasharray="10 8"/>
  <g transform="translate(528 120) scale(0.6875)">
    <rect width="64" height="64" rx="16" fill="#00786f"/>
    <rect x="16" y="14" width="8" height="36" rx="4" fill="#ffffff"/>
    <path d="M44 18 30 32 44 46" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="586" y="150" font-family="sans-serif" font-size="22" font-weight="600" fill="#171717">KeepSimp</text>
  <text x="528" y="200" font-family="sans-serif" font-size="17" fill="#525252">A hidden browser on</text>
  <text x="528" y="224" font-family="sans-serif" font-size="17" fill="#525252">your computer</text>
  <rect x="528" y="250" width="148" height="34" rx="17" fill="#e6f2f1"/><text x="546" y="273" font-family="sans-serif" font-size="15" fill="#00564f">JSON</text>
  <rect x="686" y="250" width="148" height="34" rx="17" fill="#e6f2f1"/><text x="704" y="273" font-family="sans-serif" font-size="15" fill="#00564f">Colour</text>
  <rect x="528" y="296" width="148" height="34" rx="17" fill="#e6f2f1"/><text x="546" y="319" font-family="sans-serif" font-size="15" fill="#00564f">PDF</text>
  <rect x="686" y="296" width="148" height="34" rx="17" fill="#e6f2f1"/><text x="704" y="319" font-family="sans-serif" font-size="15" fill="#00564f">Images, audio</text>
  <rect x="300" y="440" width="300" height="110" rx="14" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
  <path d="M330 466 h40 l14 14 v46 h-54 z" fill="#e6f2f1" stroke="#00786f" stroke-width="3" stroke-linejoin="round"/>
  <text x="404" y="492" font-family="sans-serif" font-size="18" font-weight="600" fill="#171717">data-formatted.json</text>
  <text x="404" y="520" font-family="sans-serif" font-size="15" fill="#525252">beside data.json · not uploaded</text>
</svg>
