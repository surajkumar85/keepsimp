<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Make a fillable PDF form</title><desc id="desc">A name field, checkbox and two radio choices on a PDF beside a field settings panel.</desc>
<rect width="900" height="600" rx="24" fill="#f5f5f0"/>
<rect x="80" y="50" width="400" height="500" fill="#fff" stroke="#d4d4d4"/>
<g font-family="sans-serif" fill="#0a0a0a"><text x="110" y="102" font-size="24" font-weight="600">Registration</text><text x="110" y="150" font-size="16">Your name</text><rect x="110" y="164" width="320" height="44" rx="8" fill="#00786f" fill-opacity=".08" stroke="#00786f" stroke-width="2"/><text x="124" y="193" font-size="17">Ada Lovelace</text><rect x="110" y="254" width="24" height="24" fill="#fff" stroke="#00786f" stroke-width="2"/><path d="M114 266l6 6 10-13" fill="none" stroke="#00786f" stroke-width="2"/><text x="148" y="273" font-size="16">Send me a copy</text><text x="110" y="338" font-size="16">Attend</text><circle cx="122" cy="373" r="12" fill="#fff" stroke="#00786f" stroke-width="2"/><circle cx="122" cy="373" r="6" fill="#00786f"/><text x="148" y="380" font-size="16">In person</text><circle cx="122" cy="419" r="12" fill="#fff" stroke="#00786f" stroke-width="2"/><text x="148" y="426" font-size="16">Online</text></g>
<rect x="530" y="95" width="300" height="390" rx="16" fill="#fff" stroke="#d4d4d4"/>
<g font-family="sans-serif" fill="#0a0a0a"><text x="550" y="132" font-size="20" font-weight="600">Field settings</text><text x="550" y="173" font-size="14">Field name</text><rect x="550" y="185" width="260" height="40" rx="8" fill="#fff" stroke="#d4d4d4"/><text x="562" y="211" font-size="16">Full name</text><text x="550" y="257" font-size="14">Tooltip</text><rect x="550" y="268" width="260" height="40" rx="8" fill="#fff" stroke="#d4d4d4"/><text x="562" y="294" font-size="16">Your full name</text><rect x="550" y="337" width="20" height="20" rx="4" fill="#00786f"/><path d="M554 347l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/><text x="582" y="353" font-size="15">Required field</text><text x="550" y="390" font-size="13" fill="#737373">Real fields. Kept in your PDF.</text><rect x="550" y="414" width="260" height="44" rx="8" fill="#00786f"/><text x="680" y="442" font-size="16" fill="#fff" text-anchor="middle">Save field properties</text></g>
</svg>
