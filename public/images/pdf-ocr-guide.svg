<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Make a scanned PDF searchable in your browser</title><desc id="desc">A scanned page, slightly grey and tilted lines of text, with the word invoice found by a search and highlighted on two lines, beside a panel that says 1,204 words were recognised on 3 pages, 94% sure on average.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <rect x="80" y="50" width="400" height="520" fill="#fbfaf6" stroke="#d4d4d4"/>
  <g transform="rotate(-0.8 280 310)">
    <rect x="120" y="96" width="190" height="16" rx="4" fill="#3a3a3a"/>
    <g fill="#8f8f8f"><rect x="120" y="140" width="320" height="9" rx="4"/><rect x="120" y="162" width="280" height="9" rx="4"/><rect x="120" y="184" width="320" height="9" rx="4"/><rect x="120" y="206" width="200" height="9" rx="4"/><rect x="120" y="252" width="150" height="9" rx="4"/><rect x="120" y="274" width="290" height="9" rx="4"/><rect x="120" y="296" width="320" height="9" rx="4"/><rect x="120" y="318" width="310" height="9" rx="4"/><rect x="120" y="340" width="180" height="9" rx="4"/><rect x="120" y="386" width="320" height="9" rx="4"/><rect x="120" y="408" width="300" height="9" rx="4"/><rect x="120" y="430" width="110" height="9" rx="4"/><rect x="120" y="498" width="320" height="9" rx="4"/><rect x="120" y="520" width="200" height="9" rx="4"/></g>
    <g fill="#f5c400" fill-opacity=".45" stroke="#c99a00" stroke-width="1.5"><rect x="214" y="156" width="86" height="21" rx="3"/><rect x="118" y="380" width="86" height="21" rx="3"/></g>
  </g>
  <rect x="540" y="110" width="300" height="380" rx="16" fill="#fff" stroke="#d4d4d4"/>
  <text x="562" y="150" font-family="sans-serif" font-size="18" font-weight="600" fill="#0a0a0a">Recognise text</text>
  <text x="562" y="184" font-family="sans-serif" font-size="13" fill="#737373">Pages</text>
  <rect x="562" y="194" width="256" height="34" rx="8" fill="#fff" stroke="#d4d4d4"/>
  <text x="576" y="216" font-family="sans-serif" font-size="14" fill="#737373">All pages</text>
  <text x="562" y="256" font-family="sans-serif" font-size="13" fill="#737373">Language</text>
  <text x="562" y="276" font-family="sans-serif" font-size="14" fill="#0a0a0a">English</text>
  <circle cx="574" cy="318" r="10" fill="#00786f"/><path d="M569 318l4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="594" y="323" font-family="sans-serif" font-size="14" fill="#0a0a0a">1,204 words on 3 pages</text>
  <text x="594" y="345" font-family="sans-serif" font-size="13" fill="#737373">94% sure on average</text>
  <rect x="562" y="372" width="256" height="34" rx="8" fill="#fff" stroke="#00786f" stroke-width="2"/>
  <circle cx="584" cy="388" r="6" fill="none" stroke="#00786f" stroke-width="2"/><path d="M589 393l5 5" stroke="#00786f" stroke-width="2" stroke-linecap="round"/>
  <text x="604" y="394" font-family="sans-serif" font-size="14" fill="#0a0a0a">invoice</text>
  <text x="806" y="394" font-family="sans-serif" font-size="12" fill="#737373" text-anchor="end">2 found</text>
  <rect x="562" y="430" width="256" height="38" rx="10" fill="#00786f"/>
  <text x="690" y="454" font-family="sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Recognise text on 3 pages</text>
</svg>
