<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Fitting a video under a size</title><desc id="desc">A large video file of 84 MB passes through a size limit of 25 MB and comes out as a smaller file of 24.1 MB, with three checks: bitrate chosen, written and checked, looks very close.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <g font-family="sans-serif">
    <rect x="56" y="140" width="250" height="300" rx="20" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <rect x="80" y="166" width="202" height="150" rx="10" fill="#00564f"/>
    <path d="M80 280 L150 220 L210 268 L250 236 L282 262 V316 H80 Z" fill="#00786f"/>
    <path d="M166 222 L194 241 L166 260 Z" fill="#fafafa"/>
    <text x="80" y="362" font-size="22" font-weight="600" fill="#171717">trip.mov</text>
    <text x="80" y="394" font-size="17" fill="#525252">1080p · 84 MB</text>
    <path d="M326 290 H386" stroke="#00786f" stroke-width="6" stroke-linecap="round"/>
    <rect x="396" y="236" width="150" height="108" rx="54" fill="#00786f"/>
    <text x="471" y="284" text-anchor="middle" font-size="16" fill="#e6f2f1">under</text>
    <text x="471" y="316" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">25 MB</text>
    <path d="M556 290 H616" stroke="#00786f" stroke-width="6" stroke-linecap="round"/>
    <path d="M600 272 L620 290 L600 308" fill="none" stroke="#00786f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="636" y="196" width="208" height="188" rx="20" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <rect x="660" y="220" width="160" height="96" rx="8" fill="#00564f"/>
    <path d="M660 292 L712 252 L760 284 L790 264 L820 280 V316 H660 Z" fill="#00786f"/>
    <text x="660" y="346" font-size="20" font-weight="600" fill="#171717">trip.mp4</text>
    <text x="660" y="372" font-size="16" fill="#525252">720p · 24.1 MB</text>
    <rect x="56" y="476" width="788" height="76" rx="16" fill="#e6f2f1"/>
    <circle cx="92" cy="514" r="13" fill="#00786f"/><path d="M86 514 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="114" y="520" font-size="17" fill="#00564f">Bitrate chosen</text>
    <circle cx="322" cy="514" r="13" fill="#00786f"/><path d="M316 514 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="344" y="520" font-size="17" fill="#00564f">Written and checked</text>
    <circle cx="594" cy="514" r="13" fill="#00786f"/><path d="M588 514 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="616" y="520" font-size="17" fill="#00564f">Looks very close</text>
  </g>
</svg>
