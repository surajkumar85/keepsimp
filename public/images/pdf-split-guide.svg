  <g fill="#fff" stroke="#d4d4d4"><rect x="60" y="70" width="780" height="200" rx="16"/><rect x="60" y="330" width="210" height="200" rx="16"/><rect x="290" y="330" width="300" height="200" rx="16"/><rect x="610" y="330" width="230" height="200" rx="16"/></g>
