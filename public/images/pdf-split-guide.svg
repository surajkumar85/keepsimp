  <g fill="#fff" stroke="#a3a3a3" stroke-width="2"><rect x="87" y="135" width="72" height="100" rx="4"/><rect x="177" y="135" width="72" height="100" rx="4"/><rect x="307" y="135" width="72" height="100" rx="4"/><rect x="397" y="135" width="72" height="100" rx="4"/><rect x="487" y="135" width="72" height="100" rx="4"/><rect x="617" y="135" width="72" height="100" rx="4"/><rect x="707" y="135" width="72" height="100" rx="4"/></g>
