  <g stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M271 178 l14 14 M285 178 l-14 14"/><path d="M581 178 l14 14 M595 178 l-14 14"/></g>
  <g fill="#fff" stroke="#00786f" stroke-width="2"><rect x="79" y="395" width="72" height="100" rx="4"/><rect x="169" y="395" width="72" height="100" rx="4"/><rect x="309" y="395" width="72" height="100" rx="4"/><rect x="399" y="395" width="72" height="100" rx="4"/><rect x="489" y="395" width="72" height="100" rx="4"/><rect x="629" y="395" width="72" height="100" rx="4"/><rect x="719" y="395" width="72" height="100" rx="4"/></g>
