<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Verify a PDF signature in your browser</title><desc id="desc">A signed contract with a signature box at the foot of the page, beside a panel that says the signature holds over the file as it was signed, names the certificate it was made with, and says a field was filled in after it.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <rect x="80" y="50" width="400" height="520" fill="#fff" stroke="#d4d4d4"/>
  <rect x="120" y="96" width="210" height="16" rx="4" fill="#3a3a3a"/>
  <g fill="#a3a3a3"><rect x="120" y="140" width="320" height="9" rx="4"/><rect x="120" y="162" width="300" height="9" rx="4"/><rect x="120" y="184" width="320" height="9" rx="4"/><rect x="120" y="206" width="180" height="9" rx="4"/><rect x="120" y="252" width="320" height="9" rx="4"/><rect x="120" y="274" width="260" height="9" rx="4"/><rect x="120" y="296" width="310" height="9" rx="4"/><rect x="120" y="318" width="140" height="9" rx="4"/></g>
  <text x="120" y="378" font-family="sans-serif" font-size="12" fill="#737373">Witness</text>
  <rect x="120" y="386" width="150" height="26" rx="2" fill="#fff" stroke="#a3a3a3"/>
  <text x="128" y="404" font-family="sans-serif" font-size="13" fill="#0a0a0a">Alex Morgan</text>
  <rect x="120" y="446" width="240" height="84" rx="6" fill="#fff" stroke="#00786f" stroke-width="2"/>
  <path d="M138 500c18-30 30-30 34-8s14 18 26-6 22-10 30 4" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="250" y="478" font-family="sans-serif" font-size="11" fill="#525252">Signed by</text>
  <text x="250" y="494" font-family="sans-serif" font-size="11" fill="#525252">Sam Example</text>
  <text x="250" y="510" font-family="sans-serif" font-size="11" fill="#525252">2026-10-14</text>
  <rect x="540" y="96" width="300" height="408" rx="16" fill="#fff" stroke="#d4d4d4"/>
  <text x="562" y="136" font-family="sans-serif" font-size="18" font-weight="600" fill="#0a0a0a">Signatures</text>
  <text x="562" y="170" font-family="sans-serif" font-size="14" font-weight="600" fill="#0a0a0a">Client</text>
  <circle cx="574" cy="200" r="10" fill="#00786f"/><path d="M569 200l4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="594" y="196" font-family="sans-serif" font-size="13" fill="#0a0a0a">This signature holds over the</text>
  <text x="594" y="214" font-family="sans-serif" font-size="13" fill="#0a0a0a">file as it was signed.</text>
  <text x="562" y="252" font-family="sans-serif" font-size="13" fill="#525252">Signed with the certificate of</text>
  <text x="562" y="270" font-family="sans-serif" font-size="13" fill="#525252">Sam Example, issued by</text>
  <text x="562" y="288" font-family="sans-serif" font-size="13" fill="#525252">KeepSimp Test Authority.</text>
  <text x="562" y="318" font-family="sans-serif" font-size="13" fill="#737373">14 October 2026 · Agreed</text>
  <rect x="562" y="338" width="256" height="86" rx="8" fill="#f5f5f5"/>
  <text x="576" y="362" font-family="sans-serif" font-size="13" fill="#0a0a0a">Added after it:</text>
  <text x="576" y="384" font-family="sans-serif" font-size="13" fill="#0a0a0a">a field was filled in</text>
  <text x="576" y="404" font-family="sans-serif" font-size="13" fill="#0a0a0a">(“Witness”)</text>
  <rect x="562" y="440" width="256" height="38" rx="10" fill="#fff" stroke="#d4d4d4"/>
  <text x="690" y="464" font-family="sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="middle">Show on page 1</text>
