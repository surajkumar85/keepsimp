<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Removing the sound from a video</title><desc id="desc">A video file with a picture track and a sound track; the sound track is crossed out and the picture track passes into the result unchanged.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <g font-family="sans-serif">
    <rect x="70" y="120" width="330" height="300" rx="20" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <text x="96" y="168" font-size="22" font-weight="600" fill="#171717">clip.mp4</text>
    <rect x="96" y="196" width="278" height="70" rx="10" fill="#00786f"/>
    <text x="114" y="240" font-size="18" fill="#ffffff">Picture</text>
    <rect x="96" y="290" width="278" height="70" rx="10" fill="#e5e5e5"/>
    <path d="M110 325 q14 -24 28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0" fill="none" stroke="#a3a3a3" stroke-width="3"/>
    <path d="M110 300 L360 350 M110 350 L360 300" stroke="#525252" stroke-width="4" stroke-linecap="round"/>
    <path d="M420 231 H490" stroke="#00786f" stroke-width="6" stroke-linecap="round"/>
    <path d="M474 213 L494 231 L474 249" fill="none" stroke="#00786f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="520" y="150" width="310" height="170" rx="20" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <text x="544" y="196" font-size="22" font-weight="600" fill="#171717">clip.mp4</text>
    <rect x="544" y="220" width="262" height="70" rx="10" fill="#00786f"/>
    <text x="562" y="264" font-size="18" fill="#ffffff">Picture, copied as it is</text>
    <rect x="56" y="470" width="788" height="76" rx="16" fill="#e6f2f1"/>
    <text x="92" y="516" font-size="18" fill="#00564f">No encoding · nothing lost · checked to have no sound</text>
  </g>
</svg>
