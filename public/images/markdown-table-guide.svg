<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Cells becoming a Markdown table</title><desc id="desc">A grid of cells on the left becomes a Markdown table with its pipes lined up on the right.</desc>
<rect width="1200" height="800" fill="#eef3fb" />
<rect x="85" y="150" width="440" height="500" rx="24" fill="#ffffff" />
<rect x="675" y="150" width="440" height="500" rx="24" fill="#1d4ed8" />
<g fill="#1d4ed8" font-family="monospace" font-size="28"><text x="120" y="230">Name    Age</text><text x="120" y="280">Ada     36</text><text x="120" y="330">Grace   45</text></g>
<g fill="#ffffff" font-family="monospace" font-size="28"><text x="715" y="230">| Name  | Age |</text><text x="715" y="280">| ----- | --- |</text><text x="715" y="330">| Ada   | 36  |</text><text x="715" y="380">| Grace | 45  |</text></g>
<path d="M565 400h70m-22-22 22 22-22 22" fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
<g fill="#1d4ed8" font-family="sans-serif" font-size="22"><text x="120" y="605">Cells from a sheet.</text></g><g fill="#ffffff" font-family="sans-serif" font-size="22"><text x="715" y="605">A Markdown table.</text></g>
</svg>
