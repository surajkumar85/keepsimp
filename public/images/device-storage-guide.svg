<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">What KeepSimp keeps in your browser</title><desc id="desc">The Kept on this device panel: a total at the top, then the offline copy, a Markdown draft and a remembered signature, each with its size and a Remove button, and nothing sent to a server.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <rect x="210" y="40" width="480" height="520" rx="18" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
  <ellipse cx="250" cy="82" rx="16" ry="6" fill="none" stroke="#00786f" stroke-width="3"/>
  <path d="M234 82 v20 a16 6 0 0 0 32 0 v-20" fill="none" stroke="#00786f" stroke-width="3"/>
  <text x="284" y="90" font-family="sans-serif" font-size="22" font-weight="600" fill="#171717">Kept on this device</text>
  <rect x="234" y="124" width="432" height="92" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  <text x="254" y="154" font-family="sans-serif" font-size="15" fill="#525252">Kept by KeepSimp</text>
  <text x="254" y="196" font-family="sans-serif" font-size="34" font-weight="600" fill="#171717">58 MB</text>
  <text x="234" y="252" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#525252">SAVED FOR OFFLINE USE</text>
  <text x="234" y="284" font-family="sans-serif" font-size="17" font-weight="600" fill="#171717">Offline copy of KeepSimp</text>
  <text x="666" y="284" text-anchor="end" font-family="monospace" font-size="17" fill="#171717">54 MB</text>
  <rect x="234" y="298" width="86" height="30" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
  <text x="277" y="318" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#171717">Remove</text>
  <path d="M234 348 H666" stroke="#e5e5e5" stroke-width="2"/>
  <text x="234" y="384" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#525252">YOUR WORK</text>
  <text x="234" y="416" font-family="sans-serif" font-size="17" font-weight="600" fill="#171717">Markdown documents</text>
  <text x="666" y="416" text-anchor="end" font-family="monospace" font-size="17" fill="#171717">3.4 MB</text>
  <rect x="234" y="430" width="86" height="30" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
  <text x="277" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#171717">Remove</text>
  <path d="M234 480 H666" stroke="#e5e5e5" stroke-width="2"/>
  <text x="234" y="512" font-family="sans-serif" font-size="17" font-weight="600" fill="#171717">Your signature and initials</text>
  <text x="666" y="512" text-anchor="end" font-family="monospace" font-size="17" fill="#171717">18 KB</text>
  <path d="M60 300 H170" stroke="#d4d4d4" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <path d="M40 260 a28 28 0 0 1 54 -8 a22 22 0 0 1 26 28 h-80 a18 18 0 0 1 0 -20 z" fill="none" stroke="#a3a3a3" stroke-width="3" stroke-linejoin="round"/>
  <path d="M44 236 L120 296" stroke="#a3a3a3" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#525252">Nothing sent</text>
  <rect x="720" y="250" width="140" height="100" rx="14" fill="#e6f2f1"/>
  <text x="790" y="292" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#00564f">Measured on</text>
  <text x="790" y="316" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#00564f">this device</text>
</svg>
