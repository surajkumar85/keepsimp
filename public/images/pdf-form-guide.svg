  <rect x="614" y="258" width="150" height="26" rx="13" fill="#00786f"/>
  <text x="689" y="276" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">Go to the next one</text>
  <g font-family="sans-serif" font-size="15" fill="#525252"><text x="590" y="352">Tab goes from field to field.</text><text x="590" y="378">Nothing is uploaded.</text></g>
