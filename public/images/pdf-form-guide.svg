  <rect x="60" y="60" width="480" height="540" fill="#fff" stroke="#d4d4d4"/>
  <rect x="100" y="100" width="210" height="18" rx="4" fill="#0a0a0a"/>
  <g fill="#b9b9b9"><rect x="100" y="150" width="70" height="9" rx="4"/><rect x="100" y="226" width="50" height="9" rx="4"/><rect x="100" y="302" width="90" height="9" rx="4"/><rect x="132" y="326" width="60" height="9" rx="4"/><rect x="242" y="326" width="50" height="9" rx="4"/><rect x="342" y="326" width="60" height="9" rx="4"/><rect x="100" y="370" width="120" height="9" rx="4"/><rect x="132" y="512" width="230" height="9" rx="4"/></g>
  <rect x="100" y="168" width="400" height="36" fill="#e6f2f0" stroke="#00786f" stroke-width="2.5"/>
  <text x="112" y="193" font-family="sans-serif" font-size="18" fill="#0a0a0a">Ada Lovelace</text>
  <rect x="246" y="174" width="2" height="24" fill="#00786f"/>
  <rect x="100" y="244" width="400" height="36" fill="#e6f2f0" stroke="#c42430" stroke-width="2"/>
  <g fill="#fff" stroke="#a3a3a3" stroke-width="1.5"><circle cx="110" cy="330" r="10"/><circle cx="220" cy="330" r="10"/><circle cx="320" cy="330" r="10"/></g>
  <circle cx="220" cy="330" r="5" fill="#0a0a0a"/>
  <rect x="100" y="388" width="240" height="96" fill="#fff" stroke="#a3a3a3" stroke-width="1.5"/>
  <rect x="102" y="420" width="236" height="30" fill="#c2dbff"/>
  <g font-family="sans-serif" font-size="16" fill="#0a0a0a"><text x="112" y="411">Novels</text><text x="112" y="441">History</text><text x="112" y="471">Science</text></g>
  <rect x="100" y="506" width="20" height="20" rx="3" fill="#fff" stroke="#a3a3a3" stroke-width="1.5"/>
