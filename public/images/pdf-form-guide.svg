<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Fill in a PDF form in your browser</title><desc id="desc">A form in a PDF with a name typed into a field, a field that must still be filled in marked in red, a round button chosen, a list with one line picked and a ticked box, beside a note that two fields are still empty.</desc>
