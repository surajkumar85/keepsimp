<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Crop a PDF in your browser</title><desc id="desc">A page of a PDF with wide margins and a frame drawn round its text; outside the frame the page is shaded, and four numbers say how much is cut off each edge.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <rect x="80" y="50" width="400" height="520" fill="#fff" stroke="#d4d4d4"/>
  <rect x="170" y="150" width="150" height="16" rx="4" fill="#0a0a0a"/>
  <g fill="#b9b9b9"><rect x="170" y="190" width="220" height="9" rx="4"/><rect x="170" y="212" width="200" height="9" rx="4"/><rect x="170" y="234" width="220" height="9" rx="4"/><rect x="170" y="256" width="160" height="9" rx="4"/><rect x="170" y="300" width="220" height="9" rx="4"/><rect x="170" y="322" width="190" height="9" rx="4"/><rect x="170" y="344" width="210" height="9" rx="4"/><rect x="170" y="366" width="120" height="9" rx="4"/></g>
  <rect x="170" y="400" width="220" height="60" rx="6" fill="#e5efe9"/>
  <g fill="#0a0a0a" fill-opacity=".38"><rect x="80" y="50" width="400" height="76"/><rect x="80" y="484" width="400" height="86"/><rect x="80" y="126" width="66" height="358"/><rect x="414" y="126" width="66" height="358"/></g>
  <rect x="146" y="126" width="268" height="358" fill="none" stroke="#00786f" stroke-width="2.5"/>
  <g fill="#00786f" stroke="#fff" stroke-width="2"><rect x="140" y="285" width="12" height="40" rx="6"/><rect x="408" y="285" width="12" height="40" rx="6"/><rect x="260" y="120" width="40" height="12" rx="6"/><rect x="260" y="478" width="40" height="12" rx="6"/></g>
  <rect x="540" y="110" width="300" height="380" rx="16" fill="#fff" stroke="#d4d4d4"/>
  <text x="562" y="150" font-family="sans-serif" font-size="18" font-weight="600" fill="#0a0a0a">Cut off, in points</text>
  <g font-family="sans-serif" font-size="14" fill="#737373"><text x="562" y="196">Left</text><text x="562" y="244">Top</text><text x="562" y="292">Right</text><text x="562" y="340">Bottom</text></g>
  <g fill="#fff" stroke="#d4d4d4"><rect x="650" y="174" width="168" height="34" rx="8"/><rect x="650" y="222" width="168" height="34" rx="8"/><rect x="650" y="270" width="168" height="34" rx="8"/><rect x="650" y="318" width="168" height="34" rx="8"/></g>
  <g font-family="monospace" font-size="15" fill="#0a0a0a"><text x="664" y="196">66</text><text x="664" y="244">76</text><text x="664" y="292">66</text><text x="664" y="340">86</text></g>
  <g font-family="sans-serif" font-size="14"><rect x="562" y="376" width="96" height="32" rx="16" fill="#00786f"/><text x="610" y="397" fill="#fff" text-anchor="middle">This page</text><rect x="666" y="376" width="96" height="32" rx="16" fill="#fff" stroke="#d4d4d4"/><text x="714" y="397" fill="#0a0a0a" text-anchor="middle">All pages</text></g>
  <rect x="562" y="430" width="256" height="38" rx="10" fill="#00786f"/>
  <text x="690" y="454" font-family="sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Crop</text>
</svg>
