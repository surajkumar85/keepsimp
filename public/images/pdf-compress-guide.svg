<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Make a PDF smaller</title><desc id="desc">A bar shows that most of a 4.8 MB PDF is pictures. After compressing, the pictures are a fraction of their size, the text is unchanged and the file is 0.9 MB.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <g fill="#fff" stroke="#d4d4d4"><rect x="60" y="70" width="780" height="200" rx="16"/><rect x="60" y="330" width="780" height="200" rx="16"/></g>
  <g font-family="sans-serif" font-size="17" fill="#525252"><text x="87" y="110">REPORT.PDF</text><text x="87" y="370">REPORT-COMPRESSED.PDF</text></g>
  <g font-family="monospace" font-size="22" fill="#0a0a0a" text-anchor="end"><text x="813" y="112">4.8 MB</text><text x="813" y="372">0.9 MB</text></g>
  <g><rect x="87" y="140" width="610" height="34" rx="17" fill="#00564f"/><rect x="701" y="140" width="62" height="34" fill="#00786f"/><rect x="767" y="140" width="46" height="34" rx="17" fill="#a3a3a3"/></g>
  <g><rect x="87" y="400" width="52" height="34" rx="17" fill="#00564f"/><rect x="143" y="400" width="62" height="34" fill="#00786f"/><rect x="209" y="400" width="46" height="34" rx="17" fill="#a3a3a3"/></g>
  <g font-family="sans-serif" font-size="16" fill="#525252"><circle cx="95" cy="214" r="7" fill="#00564f"/><text x="110" y="220">Pictures</text><circle cx="215" cy="214" r="7" fill="#00786f"/><text x="230" y="220">Fonts and text</text><circle cx="385" cy="214" r="7" fill="#a3a3a3"/><text x="400" y="220">Everything else</text></g>
  <g font-family="sans-serif" font-size="16" fill="#525252"><text x="87" y="478">Pictures brought down to the size they are shown at. Text untouched.</text></g>
  <g stroke="#00786f" stroke-width="2" fill="none" stroke-linecap="round"><path d="M450 280 v36 m-8 -10 l8 10 l8 -10"/></g>
  <g fill="#00786f"><circle cx="760" cy="470" r="26"/></g>
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M748 471 l9 9 l16 -18"/></g>
</svg>
