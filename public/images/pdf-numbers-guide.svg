<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Add page numbers to a PDF in your browser</title><desc id="desc">Three pages of a PDF in a row, each with its number at the foot, Page 1 of 3 to Page 3 of 3, beside a panel where the way a number is written and its place are chosen.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <g fill="#fff" stroke="#d4d4d4"><rect x="50" y="150" width="150" height="210"/><rect x="216" y="150" width="150" height="210"/><rect x="382" y="150" width="150" height="210"/></g>
  <g fill="#0a0a0a"><rect x="68" y="172" width="70" height="9" rx="4"/><rect x="234" y="172" width="56" height="9" rx="4"/><rect x="400" y="172" width="80" height="9" rx="4"/></g>
  <g fill="#b9b9b9"><rect x="68" y="196" width="114" height="6" rx="3"/><rect x="68" y="210" width="100" height="6" rx="3"/><rect x="68" y="224" width="114" height="6" rx="3"/><rect x="68" y="238" width="80" height="6" rx="3"/><rect x="68" y="266" width="114" height="6" rx="3"/><rect x="68" y="280" width="96" height="6" rx="3"/><rect x="234" y="196" width="114" height="6" rx="3"/><rect x="234" y="210" width="90" height="6" rx="3"/><rect x="234" y="224" width="114" height="6" rx="3"/><rect x="234" y="252" width="114" height="6" rx="3"/><rect x="234" y="266" width="104" height="6" rx="3"/><rect x="234" y="280" width="70" height="6" rx="3"/><rect x="400" y="196" width="114" height="6" rx="3"/><rect x="400" y="210" width="108" height="6" rx="3"/><rect x="400" y="238" width="114" height="6" rx="3"/><rect x="400" y="252" width="84" height="6" rx="3"/><rect x="400" y="266" width="114" height="6" rx="3"/></g>
  <g font-family="sans-serif" font-size="11" fill="#0a0a0a" text-anchor="middle"><text x="125" y="344">Page 1 of 3</text><text x="291" y="344">Page 2 of 3</text><text x="457" y="344">Page 3 of 3</text></g>
  <g fill="none" stroke="#00786f" stroke-width="1.5" stroke-dasharray="5 4"><rect x="88" y="330" width="74" height="20" rx="3"/><rect x="254" y="330" width="74" height="20" rx="3"/><rect x="420" y="330" width="74" height="20" rx="3"/></g>
  <g font-family="monospace" font-size="13" fill="#737373" text-anchor="middle"><text x="125" y="392">1</text><text x="291" y="392">2</text><text x="457" y="392">3</text></g>
  <text x="50" y="450" font-family="monospace" font-size="15" fill="#0a0a0a">ACME-000120   ACME-000121   ACME-000122</text>
  <text x="50" y="476" font-family="sans-serif" font-size="13" fill="#737373">Or a number that runs on from page to page.</text>
  <rect x="580" y="90" width="270" height="420" rx="16" fill="#fff" stroke="#d4d4d4"/>
  <text x="602" y="130" font-family="sans-serif" font-size="18" font-weight="600" fill="#0a0a0a">Page numbers</text>
  <g font-family="sans-serif" font-size="13" fill="#737373"><text x="602" y="164">Written as</text><text x="602" y="238">Place</text><text x="602" y="352">Pages</text></g>
  <g fill="#fff" stroke="#d4d4d4"><rect x="602" y="174" width="226" height="34" rx="8"/><rect x="602" y="362" width="226" height="34" rx="8"/></g>
  <g font-family="sans-serif" font-size="14" fill="#0a0a0a"><text x="616" y="196">Page 1 of 12</text></g>
  <text x="616" y="384" font-family="sans-serif" font-size="14" fill="#a3a3a3">All pages</text>
  <g fill="#fff" stroke="#d4d4d4"><rect x="602" y="248" width="70" height="32" rx="8"/><rect x="680" y="248" width="70" height="32" rx="8"/><rect x="758" y="248" width="70" height="32" rx="8"/><rect x="602" y="288" width="70" height="32" rx="8"/><rect x="758" y="288" width="70" height="32" rx="8"/></g>
  <rect x="680" y="288" width="70" height="32" rx="8" fill="#00786f"/>
  <g fill="#b9b9b9"><rect x="610" y="256" width="20" height="5" rx="2"/><rect x="705" y="256" width="20" height="5" rx="2"/><rect x="800" y="256" width="20" height="5" rx="2"/><rect x="610" y="307" width="20" height="5" rx="2"/><rect x="800" y="307" width="20" height="5" rx="2"/></g>
  <rect x="705" y="307" width="20" height="5" rx="2" fill="#fff"/>
  <rect x="602" y="440" width="226" height="38" rx="10" fill="#00786f"/>
  <text x="715" y="464" font-family="sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Add to 3 pages</text>
</svg>
