<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Sign a PDF in your browser</title><desc id="desc">A form in a PDF with a typed name, two ticked boxes, a date and a handwritten signature on its line, beside a pad a signature is drawn on.</desc>
