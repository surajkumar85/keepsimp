<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Markdown becoming a web page</title><desc id="desc">Markdown text on the left becomes HTML on the right.</desc>
<rect width="1200" height="800" fill="#eef3fb" />
<rect x="85" y="150" width="440" height="500" rx="24" fill="#ffffff" />
<rect x="675" y="150" width="440" height="500" rx="24" fill="#1d4ed8" />
<g fill="#1d4ed8" font-family="monospace" font-size="28"><text x="120" y="230"># Notes</text><text x="120" y="280"></text><text x="120" y="330">Some **bold**</text><text x="120" y="380">- a list</text></g>
<g fill="#ffffff" font-family="monospace" font-size="28"><text x="715" y="230">&lt;h1&gt;Notes&lt;/h1&gt;</text><text x="715" y="280">&lt;p&gt;Some</text><text x="715" y="330">  &lt;strong&gt;bold&lt;/strong&gt;</text><text x="715" y="380">&lt;ul&gt;&lt;li&gt;a list</text></g>
<path d="M565 400h70m-22-22 22 22-22 22" fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
