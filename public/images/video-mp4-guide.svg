<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">MOV, WebM and MKV to MP4</title><desc id="desc">Three file cards labelled MOV, WebM and MKV join into one MP4 file card, beside a phone, a laptop and a television that all play it.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <g font-family="sans-serif">
    <rect x="56" y="88" width="210" height="104" rx="16" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <text x="84" y="132" font-size="26" font-weight="600" fill="#171717">MOV</text>
    <text x="84" y="164" font-size="15" fill="#525252">from an iPhone</text>
    <rect x="56" y="248" width="210" height="104" rx="16" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <text x="84" y="292" font-size="26" font-weight="600" fill="#171717">WebM</text>
    <text x="84" y="324" font-size="15" fill="#525252">from a screen recorder</text>
    <rect x="56" y="408" width="210" height="104" rx="16" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <text x="84" y="452" font-size="26" font-weight="600" fill="#171717">MKV</text>
    <text x="84" y="484" font-size="15" fill="#525252">from a camera or a game</text>
  </g>
  <path d="M276 140 C330 140 330 300 384 300 M276 300 H384 M276 460 C330 460 330 300 384 300" fill="none" stroke="#00786f" stroke-width="5" stroke-linecap="round"/>
  <rect x="396" y="228" width="200" height="144" rx="18" fill="#00786f"/>
  <text x="430" y="296" font-family="sans-serif" font-size="40" font-weight="700" fill="#ffffff">MP4</text>
  <text x="430" y="334" font-family="sans-serif" font-size="16" fill="#e6f2f1">H.264 and AAC</text>
  <path d="M608 300 H650" stroke="#00786f" stroke-width="5" stroke-linecap="round"/>
  <rect x="670" y="120" width="76" height="140" rx="14" fill="#171717"/>
  <rect x="680" y="136" width="56" height="104" rx="6" fill="#00564f"/>
  <path d="M700 172 L722 188 L700 204 Z" fill="#fafafa"/>
  <rect x="664" y="290" width="184" height="114" rx="10" fill="#171717"/>
  <rect x="676" y="302" width="160" height="90" rx="4" fill="#00564f"/>
  <path d="M746 332 L770 347 L746 362 Z" fill="#fafafa"/>
  <rect x="644" y="404" width="224" height="12" rx="6" fill="#404040"/>
  <rect x="660" y="446" width="196" height="110" rx="8" fill="#171717"/>
  <rect x="670" y="456" width="176" height="90" rx="4" fill="#00564f"/>
  <path d="M748 486 L772 501 L748 516 Z" fill="#fafafa"/>
</svg>
