<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Add a watermark to a PDF in your browser</title><desc id="desc">A page of a PDF with the word DRAFT written faintly across it from corner to corner, beside a panel with the words of the watermark and two sliders, for how solid and how large it is.</desc>
  <rect width="900" height="600" rx="24" fill="#f5f5f0"/>
  <rect x="80" y="50" width="400" height="520" fill="#fff" stroke="#d4d4d4"/>
  <rect x="120" y="96" width="170" height="16" rx="4" fill="#0a0a0a"/>
  <g fill="#b9b9b9"><rect x="120" y="140" width="320" height="9" rx="4"/><rect x="120" y="162" width="300" height="9" rx="4"/><rect x="120" y="184" width="320" height="9" rx="4"/><rect x="120" y="206" width="240" height="9" rx="4"/><rect x="120" y="252" width="320" height="9" rx="4"/><rect x="120" y="274" width="290" height="9" rx="4"/><rect x="120" y="296" width="320" height="9" rx="4"/><rect x="120" y="318" width="310" height="9" rx="4"/><rect x="120" y="340" width="180" height="9" rx="4"/><rect x="120" y="386" width="320" height="9" rx="4"/><rect x="120" y="408" width="300" height="9" rx="4"/><rect x="120" y="430" width="320" height="9" rx="4"/><rect x="120" y="452" width="260" height="9" rx="4"/><rect x="120" y="498" width="320" height="9" rx="4"/><rect x="120" y="520" width="200" height="9" rx="4"/></g>
  <text x="280" y="310" font-family="sans-serif" font-size="118" font-weight="700" fill="#808080" fill-opacity=".28" text-anchor="middle" dominant-baseline="middle" transform="rotate(-52 280 310)">DRAFT</text>
  <rect x="540" y="110" width="300" height="380" rx="16" fill="#fff" stroke="#d4d4d4"/>
  <text x="562" y="150" font-family="sans-serif" font-size="18" font-weight="600" fill="#0a0a0a">Watermark</text>
  <text x="562" y="184" font-family="sans-serif" font-size="13" fill="#737373">Words</text>
  <rect x="562" y="194" width="256" height="34" rx="8" fill="#fff" stroke="#d4d4d4"/>
  <text x="576" y="216" font-family="sans-serif" font-size="14" fill="#0a0a0a">DRAFT</text>
  <g><circle cx="574" cy="258" r="10" fill="#808080"/><circle cx="574" cy="258" r="14" fill="none" stroke="#00786f" stroke-width="2"/><circle cx="610" cy="258" r="10" fill="#cc1a1a"/><circle cx="642" cy="258" r="10" fill="#1a4dbf"/><circle cx="674" cy="258" r="10" fill="#0a0a0a"/></g>
  <text x="562" y="306" font-family="sans-serif" font-size="13" fill="#737373">How solid: 20%</text>
  <rect x="562" y="320" width="256" height="6" rx="3" fill="#e5e5e5"/><rect x="562" y="320" width="52" height="6" rx="3" fill="#00786f"/><circle cx="614" cy="323" r="9" fill="#00786f" stroke="#fff" stroke-width="2"/>
  <text x="562" y="366" font-family="sans-serif" font-size="13" fill="#737373">How large: 70% of the page</text>
  <rect x="562" y="380" width="256" height="6" rx="3" fill="#e5e5e5"/><rect x="562" y="380" width="180" height="6" rx="3" fill="#00786f"/><circle cx="742" cy="383" r="9" fill="#00786f" stroke="#fff" stroke-width="2"/>
  <rect x="562" y="430" width="256" height="38" rx="10" fill="#00786f"/>
  <text x="690" y="454" font-family="sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Add to 12 pages</text>
</svg>
