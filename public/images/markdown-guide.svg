<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Markdown on one side, the page it makes on the other</title><desc id="desc">Markdown text with a heading, a task list and a table on the left becomes a formatted page on the right.</desc>
<rect width="1200" height="800" fill="#eef3fb" />
<rect x="85" y="150" width="440" height="500" rx="24" fill="#ffffff" />
<rect x="675" y="150" width="440" height="500" rx="24" fill="#1d4ed8" />
<g fill="#1d4ed8" font-family="monospace" font-size="28"><text x="120" y="220"># Trip notes</text><text x="120" y="285">- [x] Tickets</text><text x="120" y="335">- [ ] A good book</text><text x="120" y="400">| Day | Where  |</text><text x="120" y="445">| --- | ------ |</text><text x="120" y="490">| Fri | Lisbon |</text></g>
<g fill="#ffffff" font-family="sans-serif"><text x="715" y="225" font-size="42" font-weight="700">Trip notes</text><text x="760" y="290" font-size="28">Tickets</text><text x="760" y="340" font-size="28">A good book</text><text x="745" y="425" font-size="26" font-weight="700">Day</text><text x="845" y="425" font-size="26" font-weight="700">Where</text><text x="745" y="480" font-size="26">Fri</text><text x="845" y="480" font-size="26">Lisbon</text></g>
<rect x="715" y="267" width="26" height="26" rx="6" fill="#ffffff" /><path d="M721 280l6 6 9-11" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<rect x="715" y="317" width="26" height="26" rx="6" fill="none" stroke="#ffffff" stroke-width="3" />
<path d="M735 445h330" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" />
<path d="M565 400h70m-22-22 22 22-22 22" fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
<g fill="#1d4ed8" font-family="sans-serif" font-size="22"><text x="120" y="605">What you type.</text></g><g fill="#ffffff" font-family="sans-serif" font-size="22"><text x="715" y="605">What people read.</text></g>
</svg>
